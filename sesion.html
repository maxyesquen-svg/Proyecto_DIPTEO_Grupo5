<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Breach | Iniciar Sesión</title>
    <link rel="stylesheet" href="styles3.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
</head>
<body>
    <header>
        <img
            src="security.png"
            alt="Logo de color rojo con silueta de oso robot y abajo letras que dice security breach"
            width="100">
        <h1>Security Breach</h1>
        <p>Tu seguridad va primero</p>
    </header>
    <hr>
    <main>
        <h2>Iniciar Sesión</h2>
        <p>
            Ingresa tus datos para acceder al sistema de reportes.
        </p>
        <form action="#" method="POST">
            <p>
                <label for="email">
                    Correo Electrónico:
                </label>
                <br>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="ejemplo@correo.com">
            </p>
            <p>
                <label for="user">
                    Usuario:
                </label>
                <br>
                <input
                    type="text"
                    id="user"
                    name="user"
                    required
                    placeholder="Nombre de usuario">
            </p>
            <p>
                <label for="password">
                    Contraseña:
                </label>
                <br>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Mínimo 8 caracteres">
            </p>
            <p>
                <button type="button" onclick="window.location.href='index.html'">
                    Ingresar
                </button>
            </p>
        </form>
        <p>
            <a href="#">
                ¿Olvidaste tu contraseña?
            </a>
        </p>
        <hr>
        <p>
            ¿No tienes una cuenta?
            <a href="#">
                Regístrate aquí
            </a>
        </p>
    </main>
    <hr>
    <footer>
        <p>
            © 2026 Sistema Integrado de Seguridad Ciudadana -
            Laboratorio Grupal
        </p>
    </footer>
</body>
</html>
